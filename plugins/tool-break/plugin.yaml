name: tool-break
version: 1.2.0
description: "Never let a stalled tool call force you to cancel a long task. You can abort an in-flight call with /break, instruct with /break {message}, or force it to repeat with /again."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/plugins/tool-break
tags:
  - desktop
  - commands
  - hooks
hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - on_session_start
  - on_session_end
