name: cdp-manager
version: 2.0.0
description: "Local Chrome CDP debug ports in the status bar: probe, launch, stop, recheck, and a managed port Hermes keeps alive, plus the `cdp` agent tool. Disclosure: launches local Chrome on 127.0.0.1 only, with per-port profiles under the Hermes home directory, and closes it with a clean Browser.close; state lives in the plugin's own config file."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/public/cdp-manager
provides_tools:
  - cdp
tags:
  - desktop
  - cdp
  - browser
  - statusbar
