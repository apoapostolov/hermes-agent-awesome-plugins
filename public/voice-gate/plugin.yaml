name: "Voice Gate"
version: "1.3.5"
description: "Reads the prose a turn changed, in Markdown, plain text, reStructuredText, AsciiDoc, Org, LaTeX, HTML and PDF, reports the AI tells it finds, and asks for one more pass before the turn finishes. The rules ship with the plugin, so nothing is fetched and no other package is required."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/public/voice-gate
tags:
  - writing
  - markdown
  - hooks
requires_hermes: ">=0.22.0"
config_schema:
  apply_hermes:
    type: bool
    default: true
    label: Hermes
    description: "Run the gate in this profile"
  apply_herald:
    type: bool
    default: true
    label: Herald
    description: "Run the gate in this profile"
  apply_keeper:
    type: bool
    default: true
    label: Keeper
    description: "Run the gate in this profile"
  apply_steward:
    type: bool
    default: true
    label: Steward
    description: "Run the gate in this profile"
  apply_tinker:
    type: bool
    default: true
    label: Tinker
    description: "Run the gate in this profile"
  vale_mode:
    type: str
    label: Vale second opinion
    description: "off, or advisory to add Vale alerts."
    choices: ["off", "advisory"]
  vale_min_alerts:
    type: number
    label: Vale minimum alerts
    description: "Speak for Vale at this many alerts."
  vale_path:
    type: str
    label: Vale binary
    description: "Empty uses the plugin's copy, then PATH."
  mode:
    type: str
    label: Mode
    description: "warn asks once, improve keeps asking, skip is off."
    choices:
      - "warn"
      - "improve"
      - "skip"
  min_words:
    type: number
    label: Minimum words
    description: "Shorter documents are ignored. Default 200."
  exceptions:
    type: str
    rows: 5
    placeholder: "em_dash: *.md, *.mdx\nsignposting: docs/**\nbold_lead_bullets: CHANGELOG.md"
    label: Exceptions
    description: "tell: glob, glob, one per line."
  # One switch per rule family. Off means the family never fires here.
  tell_closing_offers:
    type: bool
    default: true
    label: "Closing offers"
    description: "Ends by offering more work."
  tell_significance_inflation:
    type: bool
    default: true
    label: "Significance inflation"
    description: "Ordinary details dressed as turning points."
  tell_copula_avoidance:
    type: bool
    default: true
    label: "Copula avoidance"
    description: "\"Serves as\" where \"is\" would do."
  tell_hedges:
    type: bool
    default: true
    label: "Hedges"
    description: "Uncertainty stacked until the claim vanishes."
  tell_signposting:
    type: bool
    default: true
    label: "Signposting"
    description: "Announces the point instead of making it."
  tell_filler:
    type: bool
    default: true
    label: "Wordy filler"
    description: "Phrases with a shorter honest form."
  tell_transitions:
    type: bool
    default: true
    label: "Chained transitions"
    description: "\"Moreover\" and friends, carrying nothing."
  tell_trailing_qualifiers:
    type: bool
    default: true
    label: "Trailing qualifiers"
    description: "A hedge tacked onto the end."
  tell_gerund_openings:
    type: bool
    default: true
    label: "Gerund openings"
    description: "Sentences opening on \"Having\" or \"Knowing\"."
  tell_negation_positive:
    type: bool
    default: true
    label: "Negation then positive"
    description: "\"Not about X; it is about Y\"."
  tell_negation_triads:
    type: bool
    default: true
    label: "Negation triads"
    description: "\"Not just X, but Y\" frames."
  tell_verdict_openers:
    type: bool
    default: true
    label: "Verdict openers"
    description: "A verdict before the subject."
  tell_cliche_openers:
    type: bool
    default: true
    label: "Cliche openers"
    description: "\"In today's world\" and its cousins."
  tell_conclusion_signposts:
    type: bool
    default: true
    label: "Conclusion signposts"
    description: "\"In conclusion\", twice or more."
  tell_bold_pseudo_headings:
    type: bool
    default: true
    label: "Bold pseudo-headings"
    description: "Bold lines posing as headings."
  tell_bold_lead_bullets:
    type: bool
    default: true
    label: "Bold lead-in bullets"
    description: "Every bullet opens on a bold label."
  tell_buzzwords:
    type: bool
    default: true
    label: "AI vocabulary"
    description: "Delve, tapestry, seamless, and the rest."
  tell_marketing_adjectives:
    type: bool
    default: true
    label: "Promotional adjectives"
    description: "Robust, cutting-edge, world-class."
  tell_banned_words:
    type: bool
    default: true
    label: "Profile banned words"
    description: "Your own list, from the profile."
  tell_em_dashes:
    type: bool
    default: true
    label: "Em dashes"
    description: "Dash clusters where a comma would do."
  tell_candor_frames:
    type: bool
    default: true
    label: "Narrated candor"
    description: "\"To be fully transparent\" instead of the thing."
  tell_objection_frames:
    type: bool
    default: true
    label: "Shadowboxed objections"
    description: "Answers an objection nobody raised."
  tell_rhetorical_setup:
    type: bool
    default: true
    label: "Rhetorical setup"
    description: "Stages the point without making it."
  tell_emphasis_crutches:
    type: bool
    default: true
    label: "Emphasis crutches"
    description: "\"This matters because\", and similar filler."
  tell_dev_slogans:
    type: bool
    default: true
    label: "Dev slogans"
    description: "\"It just works\" where a property belongs."
  tell_template_phrases:
    type: bool
    default: true
    label: "Template phrases"
    description: "Slot-fill phrases from a template."
  tell_wh_openers:
    type: bool
    default: true
    label: "Wh- openers"
    description: "\"What makes this hard is\"."
  tell_hedge_stacked:
    type: bool
    default: true
    label: "Stacked hedges"
    description: "\"Could potentially\" inside one claim."
  tell_parenthetical_hedge:
    type: bool
    default: true
    label: "Parenthetical hedges"
    description: "A hedge parked in brackets."
  tell_future_narrative:
    type: bool
    default: true
    label: "Future narratives"
    description: "\"Will become one of the most important\"."
  tell_negative_listing:
    type: bool
    default: true
    label: "Negative listings"
    description: "\"Not a dashboard. Not a portal.\""
  tell_number_inflation:
    type: bool
    default: true
    label: "Numbered-list bait"
    description: "\"Three key takeaways\"."
  tell_hashtag_stuffing:
    type: bool
    default: true
    label: "Hashtag blocks"
    description: "Tags instead of a closing sentence."
  tell_over_compression:
    type: bool
    default: true
    label: "Over-compression"
    description: "Arrows standing in for words."
  tell_rule_of_three:
    type: bool
    default: true
    label: "Rule of three"
    description: "Three-item series, again and again."
  tell_same_openers:
    type: bool
    default: true
    label: "Same openers"
    description: "Consecutive sentences opening alike."
  tell_staccato_runs:
    type: bool
    default: true
    label: "Staccato runs"
    description: "Short sentence after short sentence."
  tell_question_runs:
    type: bool
    default: true
    label: "Question runs"
    description: "Questions stacked back to back."
  tell_bare_bullet_runs:
    type: bool
    default: true
    label: "Bare bullets"
    description: "Bullets with no verb in them."
  tell_vague_authority:
    type: bool
    default: true
    label: "Vague authority"
    description: "\"Experts say\", with no names."
  tell_real_actual:
    type: bool
    default: true
    label: "Real/actual inflation"
    description: "\"Real value\", \"actual impact\"."
  tell_endorsement_closers:
    type: bool
    default: true
    label: "Endorsement closers"
    description: "\"Bookmark this\", \"thank me later\"."
  tell_launch_copy:
    type: bool
    default: true
    label: "Launch copy"
    description: "\"Say hello to\" an introduction."
  tell_assistant_residue:
    type: bool
    default: true
    label: "Assistant residue"
    description: "\"As an AI\" left in the text."
  tell_template_residue:
    type: bool
    default: true
    label: "Template residue"
    description: "Placeholders like TBD left behind."
  tell_tool_fingerprints:
    type: bool
    default: true
    label: "Tool fingerprints"
    description: "utm_source=chatgpt in a link."
provides_hooks:
  - pre_verify
  - pre_tool_call
provides_tools:
  - voice_gate_check
  - voice_gate_vale
