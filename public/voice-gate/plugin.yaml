name: "Voice Gate"
version: "1.3.0"
description: "Checks the Markdown a turn changed for the AI tells that make writing sound machine made, and reports them before the turn finishes. The rules ship with the plugin, so nothing is fetched and no other package is required."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/public/voice-gate
tags:
  - writing
  - markdown
  - hooks
requires_hermes: ">=0.22.0"
config_schema:
  apply_hermes:
    type: bool
    default: true
    label: Hermes
    description: "Run the gate in this profile"
  apply_herald:
    type: bool
    default: true
    label: Herald
    description: "Run the gate in this profile"
  apply_keeper:
    type: bool
    default: true
    label: Keeper
    description: "Run the gate in this profile"
  apply_steward:
    type: bool
    default: true
    label: Steward
    description: "Run the gate in this profile"
  apply_tinker:
    type: bool
    default: true
    label: Tinker
    description: "Run the gate in this profile"
  vale_mode:
    type: str
    label: Vale second opinion
    description: "off, or advisory to add Vale's own alerts to the nudge when it is installed."
    choices: ["off", "advisory"]
  vale_min_alerts:
    type: number
    label: Vale minimum alerts
    description: "Speak on Vale's behalf only when it reports at least this many warnings."
  vale_path:
    type: str
    label: Vale binary
    description: "Path to a Vale binary. Empty uses the plugin's own copy, then PATH."
  mode:
    type: str
    label: Mode
    description: "Warn asks once, improve keeps asking until the tells are gone, skip turns the gate off."
    choices:
      - "warn"
      - "improve"
      - "skip"
  min_words:
    type: number
    label: Minimum words
    description: "Documents shorter than this are ignored. Default 200."
provides_hooks:
  - pre_verify
  - pre_tool_call
provides_tools:
  - voice_gate_check
  - voice_gate_vale
