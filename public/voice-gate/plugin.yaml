name: "voice-gate"
version: "1.4.3"
description: "Checks changed prose for wording and structural patterns, with optional contextual review through your Hermes model. Protects source material and allows at most two review and revision passes. Includes Vale checks and a settings page."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/public/voice-gate
tags:
  - writing
  - markdown
  - hooks
requires_hermes: ">=0.22.0"
config_schema:
  apply_hermes:
    type: bool
    default: true
    label: "Hermes"
    description: "Review changed documents."
  apply_herald:
    type: bool
    default: true
    label: "Herald"
    description: "Review changed documents."
  apply_keeper:
    type: bool
    default: true
    label: "Keeper"
    description: "Review changed documents."
  apply_steward:
    type: bool
    default: true
    label: "Steward"
    description: "Review changed documents."
  apply_tinker:
    type: bool
    default: true
    label: "Tinker"
    description: "Review changed documents."
  vale_mode:
    type: str
    label: "Include Vale checks"
    description: "Add Vale findings when a document is reviewed."
    choices: ["off", "advisory"]
  vale_min_alerts:
    type: number
    label: "Minimum Vale findings"
    description: "Show a summary after this many findings."
  vale_path:
    type: str
    label: "Vale executable"
    description: "Leave blank to find Vale automatically."
  mode:
    type: str
    label: "Review mode"
    description: "Ask once, allow two passes, or turn reviews off."
    choices:
      - "warn"
      - "improve"
      - "skip"
  context:
    type: str
    default: auto
    choices: [auto, docs, technical-blog, blog, casual, linkedin, investor-email, fiction]
    label: "Writing context"
    description: "Auto uses the file type."
  min_words:
    type: number
    label: "Minimum document length"
    description: "Default: 200 words. Use 0 to check shorter text."
  no_prose_em_dash:
    type: bool
    default: true
    label: "Flag every prose em dash"
    description: "Allow list separators and empty table values."
  model_review:
    type: bool
    default: false
    label: "Review meaning and structure"
    description: "Use your Hermes model. Adds a review request per pass."
  exceptions:
    type: str
    rows: 5
    placeholder: "signposting: README.md, *.generated.md\nbold_lead_bullets: CHANGELOG.md\nmarketing_adjectives: release-notes.txt"
    label: "File exceptions"
    description: "Write one rule per line as rule_name: file_pattern, file_pattern. For example, signposting: README.md, docs/** skips that check in README files and docs folders. Use * in filename patterns, or all: pattern to skip every check in matching files. Leaving this blank adds no exceptions."
  # One switch per rule family. Off means the family never fires here.
  tell_closing_offers:
    type: bool
    default: true
    label: "Offers to do more"
    description: "Offers such as ‘Let me know if you need more.’"
  tell_significance_inflation:
    type: bool
    default: true
    label: "Inflated importance"
    description: "Claims such as ‘a pivotal moment.’"
  tell_copula_avoidance:
    type: bool
    default: true
    label: "Indirect verbs"
    description: "‘Serves as’ where ‘is’ would do."
  tell_hedges:
    type: bool
    default: true
    label: "Repeated hedging"
    description: "Several qualifiers without a clear claim."
  tell_signposting:
    type: bool
    default: true
    label: "Announcements before the point"
    description: "‘Here’s what you need to know’ and similar lead-ins."
  tell_filler:
    type: bool
    default: true
    label: "Wordy phrases"
    description: "‘Due to the fact that’ instead of ‘because.’"
  tell_transitions:
    type: bool
    default: true
    label: "Repeated transition phrases"
    description: "Repeated ‘Moreover,’ ‘Furthermore,’ and similar links."
  tell_trailing_qualifiers:
    type: bool
    default: true
    label: "Sentence-ending qualifiers"
    description: "Endings such as ‘for the most part.’"
  tell_gerund_openings:
    type: bool
    default: true
    label: "Reflective openings"
    description: "Repeated openings such as ‘Having reviewed…’"
  tell_negation_positive:
    type: bool
    default: true
    label: "Staged contrasts"
    description: "‘It isn’t about X. It’s about Y.’"
  tell_negation_triads:
    type: bool
    default: true
    label: "‘Not just … but’ framing"
    description: "Repeated contrasts that introduce a bigger claim."
  tell_verdict_openers:
    type: bool
    default: true
    label: "Verdict-first openings"
    description: "‘The honest answer’ before the actual answer."
  tell_cliche_openers:
    type: bool
    default: true
    label: "Stock openings"
    description: "Openings such as ‘In today’s fast-paced world.’"
  tell_conclusion_signposts:
    type: bool
    default: true
    label: "Stock conclusions"
    description: "Repeated ‘In conclusion’ or ‘To sum up.’"
  tell_bold_pseudo_headings:
    type: bool
    default: true
    label: "Bold lines used as headings"
    description: "Whole lines of bold text outside normal headings."
  tell_bold_lead_bullets:
    type: bool
    default: true
    label: "Repeated bold bullet labels"
    description: "Lists where most items begin with a bold label."
  tell_buzzwords:
    type: bool
    default: true
    label: "Stock vocabulary"
    description: "Dense runs of words such as ‘delve’ and ‘tapestry.’"
  tell_marketing_adjectives:
    type: bool
    default: true
    label: "Promotional adjectives"
    description: "Repeated praise such as ‘world-class’ or ‘effortless.’"
  tell_banned_words:
    type: bool
    default: true
    label: "Words from your avoid list"
    description: "Terms you chose to flag in your writing profile."
  tell_em_dashes:
    type: bool
    default: true
    label: "Em dashes in prose"
    description: "Keep list separators and empty table values."
  tell_candor_frames:
    type: bool
    default: true
    label: "Announcements of honesty"
    description: "‘To be fully transparent’ before a routine point."
  tell_objection_frames:
    type: bool
    default: true
    label: "Unstated objections"
    description: "‘Some might say’ without an objection to answer."
  tell_rhetorical_setup:
    type: bool
    default: true
    label: "Setup before the point"
    description: "‘Think about it’ and similar prompts."
  tell_emphasis_crutches:
    type: bool
    default: true
    label: "Empty emphasis"
    description: "Statements of importance without a consequence."
  tell_dev_slogans:
    type: bool
    default: true
    label: "Developer slogans"
    description: "Claims such as ‘It just works’ or ‘sane defaults.’"
  tell_template_phrases:
    type: bool
    default: true
    label: "Template phrasing"
    description: "Generic introductions and inflated milestones."
  tell_wh_openers:
    type: bool
    default: true
    label: "Delayed-subject openings"
    description: "Repeated ‘What makes this hard is’ constructions."
  tell_hedge_stacked:
    type: bool
    default: true
    label: "Stacked qualifiers"
    description: "Pairs such as ‘could potentially.’"
  tell_parenthetical_hedge:
    type: bool
    default: true
    label: "Qualifiers in parentheses"
    description: "Repeated asides such as ‘(arguably).’"
  tell_future_narrative:
    type: bool
    default: true
    label: "Vague predictions"
    description: "‘One of the most important’ without a clear outcome."
  tell_negative_listing:
    type: bool
    default: true
    label: "Lists of what something is not"
    description: "Repeated negatives before the positive claim."
  tell_number_inflation:
    type: bool
    default: true
    label: "Numbered-list introductions"
    description: "‘Five things to know’ and similar framing."
  tell_hashtag_stuffing:
    type: bool
    default: true
    label: "Hashtag blocks"
    description: "Six or more tags in one piece of writing."
  tell_over_compression:
    type: bool
    default: true
    label: "Compressed prose"
    description: "Arrows and symbols used in place of sentences."
  tell_rule_of_three:
    type: bool
    default: true
    label: "Repeated three-item lists"
    description: "Many short, parallel groups of three."
  tell_same_openers:
    type: bool
    default: true
    label: "Repeated sentence openings"
    description: "Several sentences starting with the same word."
  tell_staccato_runs:
    type: bool
    default: true
    label: "Runs of short sentences"
    description: "Three or more very short sentences in a row."
  tell_question_runs:
    type: bool
    default: true
    label: "Back-to-back questions"
    description: "Repeated questions outside interviews and FAQs."
  tell_bare_bullet_runs:
    type: bool
    default: true
    label: "Lists of short labels"
    description: "Five or more short bullets without complete claims."
  tell_vague_authority:
    type: bool
    default: true
    label: "Unnamed sources"
    description: "Claims attributed to ‘experts’ without naming them."
  tell_real_actual:
    type: bool
    default: true
    label: "Empty ‘real’ and ‘actual’"
    description: "Claims such as ‘real value’ without a named contrast."
  tell_endorsement_closers:
    type: bool
    default: true
    label: "Generic recommendations"
    description: "‘Worth your time’ without explaining why."
  tell_launch_copy:
    type: bool
    default: true
    label: "Launch-style introductions"
    description: "‘Say hello to’ and similar product announcements."
  tell_assistant_residue:
    type: bool
    default: true
    label: "Assistant chatter"
    description: "Pleasantries, stock offers, and capability disclaimers."
  tell_template_residue:
    type: bool
    default: true
    label: "Unfilled placeholders"
    description: "TBD, sample fields, and bracketed instructions."
  tell_tool_fingerprints:
    type: bool
    default: true
    label: "AI tracking in links"
    description: "AI-referrer parameters added to a URL."
  # Generated humanizer families: scripts/sync_rule_settings.py
  tell_citation_residue:
    type: bool
    default: true
    label: "Broken citation tokens"
    description: "Internal citation codes left in the published text."
  tell_reasoning_residue:
    type: bool
    default: true
    label: "Exposed reasoning prompts"
    description: "Text such as ‘Let me think step by step.’"
  tell_load_bearing_metaphor:
    type: bool
    default: true
    label: "‘Load-bearing’ metaphors"
    description: "Abstract uses such as ‘load-bearing assumption.’"
  tell_unnecessary_hyphenation:
    type: bool
    default: true
    label: "Unnecessary hyphens"
    description: "Spellings such as ‘code-base’ and ‘in real-time.’"
  tell_fake_casual_props:
    type: bool
    default: true
    label: "Performed casualness"
    description: "Stage directions such as ‘checks notes’ or ‘mic drop.’"
  tell_crowd_contrast:
    type: bool
    default: true
    label: "Comparisons with an unnamed crowd"
    description: "Claims about what ‘everyone else’ was still doing."
  tell_participial_reframe:
    type: bool
    default: true
    label: "Reframing lead-ins"
    description: "‘Put differently’ before a repeated point."
  tell_hedged_enumeration:
    type: bool
    default: true
    label: "Hesitant list openings"
    description: "‘A few things to consider’ before the answer."
  tell_significance_adverbs:
    type: bool
    default: true
    label: "Repeated importance words"
    description: "Dense use of ‘Notably’ or ‘Importantly.’"
  tell_scar_tissue:
    type: bool
    default: true
    label: "Rejected alternatives"
    description: "Repeated options introduced only to dismiss them."
  tell_lingering_attention:
    type: bool
    default: true
    label: "Claims of lasting attention"
    description: "‘I keep coming back to this’ without a reason."
  tell_moral_category:
    type: bool
    default: true
    label: "Moral labels for technical details"
    description: "Phrases such as ‘honest architecture.’"
  tell_announced_significance:
    type: bool
    default: true
    label: "Claims that announce importance"
    description: "Repeated ‘This actually matters’ framing."
  tell_parallel_reasons:
    type: bool
    default: true
    label: "Repeated reason chains"
    description: "Three sentences in a row using ‘because’ or ‘when.’"
  tell_title_case_headings:
    type: bool
    default: true
    label: "Title case in headings"
    description: "Repeated title case where sentence case would fit."
  tell_decorative_headers:
    type: bool
    default: true
    label: "Decorative headings"
    description: "Repeated emoji headings in formal writing."
  tell_label_periods:
    type: bool
    default: true
    label: "Periods in short bullet labels"
    description: "A bold noun label ending with a period."
  tell_stranded_auxiliary:
    type: bool
    default: true
    label: "Clipped contrast endings"
    description: "Repeated endings such as ‘the data didn’t.’"
  tell_colon_triples:
    type: bool
    default: true
    label: "Three-item lists after a colon"
    description: "Repeated colon openings into groups of three."
  tell_self_labeling_significance:
    type: bool
    default: true
    label: "Comments on a point’s importance"
    description: "Calling a point ‘the clever part’ after making it."
  tell_negation_chain:
    type: bool
    default: true
    label: "Chains of negatives"
    description: "Phrases such as ‘No fluff, no filler, no jargon.’"
  tell_empty_concession:
    type: bool
    default: true
    label: "Vague concession pairs"
    description: "Repeated praise followed by an unnamed challenge."
  tell_intensifier_opposition:
    type: bool
    default: true
    label: "Exaggerated opposites"
    description: "‘Obsessively’ set against ‘barely at all.’"
  tell_stock_reaction_frame:
    type: bool
    default: true
    label: "Stock reaction phrases"
    description: "Repeated ‘What surprised me most was’ openings."
  tell_tier1a:
    type: bool
    default: true
    label: "Tier 1A: stock vocabulary"
    description: "Words to inspect for vague or inflated meaning."
  tell_tier1b:
    type: bool
    default: true
    label: "Tier 1B: wordiness"
    description: "Longer or formal phrases with plainer alternatives."
  tell_tier2:
    type: bool
    default: true
    label: "Tier 2: clustered terms"
    description: "Two or more terms in the same paragraph."
  tell_tier3:
    type: bool
    default: true
    label: "Tier 3: repeated words"
    description: "Heavy repetition of one broad descriptive word."
  tell_tier3_phrases:
    type: bool
    default: true
    label: "Tier 3: repeated phrases"
    description: "The same phrase twice, or three stock phrases."
provides_hooks:
  - pre_verify
  - pre_tool_call
provides_tools:
  - voice_gate_check
  - voice_gate_vale
  - voice_gate_review
