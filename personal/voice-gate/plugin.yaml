name: "Voice Gate"
version: "1.3.2"
description: "Checks the Markdown a turn changed against your own writing profile, then asks for one more pass before the turn finishes. The plugin ships generic rules and loads a profile document that carries your voice; with no profile loaded it behaves like the public edition."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/personal/voice-gate
tags:
  - writing
  - markdown
  - hooks
  - profiles
requires_hermes: ">=0.22.0"
config_schema:
  apply_hermes:
    type: bool
    default: true
    label: Hermes
    description: "Run the gate in this profile"
  apply_herald:
    type: bool
    default: true
    label: Herald
    description: "Run the gate in this profile"
  apply_keeper:
    type: bool
    default: true
    label: Keeper
    description: "Run the gate in this profile"
  apply_steward:
    type: bool
    default: true
    label: Steward
    description: "Run the gate in this profile"
  apply_tinker:
    type: bool
    default: true
    label: Tinker
    description: "Run the gate in this profile"
  vale_mode:
    type: str
    label: Vale second opinion
    description: "off, or advisory to add Vale's own alerts to the nudge when it is installed."
    choices: ["off", "advisory"]
  vale_min_alerts:
    type: number
    label: Vale minimum alerts
    description: "Speak on Vale's behalf only when it reports at least this many warnings."
  vale_path:
    type: str
    label: Vale binary
    description: "Path to a Vale binary. Empty uses the plugin's own copy, then PATH."
  mode:
    type: str
    label: Mode
    description: "Warn asks once, improve keeps asking until the tells are gone, skip turns the gate off."
    choices:
      - "warn"
      - "improve"
      - "skip"
  profile:
    type: str
    label: Profile
    description: "Name of a profile in HERMES_HOME/voice-profiles, or a path to one. Empty uses the generic rules."
  min_words:
    type: number
    label: Minimum words overrides
    description: "Smallest document to check. 0 uses the profile's own floor, default 200."
  exceptions:
    type: str
    label: Exceptions
    description: "One entry per line, as tell: glob, glob. It silences that family for files that match, on top of the profile's own exceptions. Empty means the profile decides alone."
provides_hooks:
  - pre_verify
  - pre_tool_call
provides_tools:
  - voice_gate_check
  - voice_gate_profile
  - voice_gate_learn
  - voice_gate_vale
