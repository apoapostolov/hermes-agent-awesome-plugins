name: hermes-agent-desktop
version: 1.0.2
description: "Hermes Agent Desktop: operate Windows apps through the accessibility tree instead of the screen. Read a window's real UI, then click, fill a field, select an option, toggle a checkbox, scroll, send a key combo, and manage windows and the clipboard. Actions are semantic and headless by default, so they do not take focus, move the cursor or synthesize keystrokes, and they fail closed rather than guess. Backed by the Vercel Labs agent-desktop binary: the plugin wraps it, and its desktop_install tool downloads the official release, verifies the checksum and proves the install. Windows only."
author: Apostol Apostolov
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/personal/hermes-agent-desktop
tags:
  - windows
  - desktop-automation
  - computer-use
  - accessibility
  - tools
provides_tools:
  - desktop_status
  - desktop_apps
  - desktop_snapshot
  - desktop_find
  - desktop_act
  - desktop_window
  - desktop_clipboard
  - desktop_batch
  - desktop_install
provides_hooks:
  - pre_tool_call
provides_middleware: []
requires_env: []
pip_dependencies: []
config_schema:
  bin_path:
    type: str
    default: ""
    label: "agent-desktop binary path"
    description: "Absolute path to an agent-desktop executable to prefer. Empty uses the plugin's own installed binary, then PATH, then the npm global install."
  install_dir:
    type: str
    default: ""
    label: "Install directory"
    description: "Where desktop_install writes the binary. Empty uses this plugin's bin/ folder."
  version:
    type: str
    default: "1.0.2"
    label: "Release to install"
    description: "Upstream agent-desktop release that desktop_install fetches. Must be a release whose digest is pinned in the plugin (1.0.2); any other version is refused."
  auto_install:
    type: bool
    default: false
    label: "Install on first use"
    description: "When the binary is missing, install it automatically instead of returning BINARY_NOT_FOUND. Downloads about 3.5 MB from the upstream GitHub release."
