description: "Portable MCP companion to byparr-tools: a dependency-free stdio server that exposes solver_get, solver_cookies, solver_load and solver_status to Codex, mcporter and other MCP clients, so a FlareSolverr-compatible solver you run yourself is reachable outside Hermes. The solver URL is forwarded from the plugin Settings page as BYPAAR_BASE_URL and defaults to the local solver port. Disclosure: the server opens outbound HTTP connections to the solver address you configure and to the URLs you ask it to fetch. Cookie values stay hidden unless showValues is true. Challenges are solved by your own solver; the plugin does not contact a hosted solver service."
